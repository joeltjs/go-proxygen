# Opencode Secure Proxy Configuration
# SECURITY FEATURES:
# - Isolated AI traffic only (no tracking other apps)
# - HTTPS encryption enforced
# - No logging enabled
# - Proxy rotation after N requests
# - Real-time threat detection

[API]
OPENCODE_API_KEY = your_api_key_here
ENDPOINT = https://api.opencode.ai/v1/chat/completions
TIMEOUT_SECONDS = 30

[PROXY]
VALIDATED_FILE = ./proxies/validated.txt
BLACKLIST_FILE = ./blacklist/dangerous.txt
ROTATION_BATCH_SIZE = 5
MIN_VALIDITY_SCORE = 80
CHECK_INTERVAL_MINUTES = 30

[SECURITY]
# Critical: Set to true to NEVER log prompts or responses
ENABLE_ENCRYPTION = false
LOG_PROMPTS = false
LOG_RESPONSES = false
LOG_PROXY_DETAILS = false
TRACK_BEHAVIOR = false

[MONITORING]
ANOMALY_THRESHOLD = 100
MAX_REQUESTS_PER_HOUR = 1000
ENABLE_GEO_CHECK = true
